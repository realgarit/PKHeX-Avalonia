# Routine version updates wait seven days; security fixes are not delayed.
# The chore prefix plus scope gives Dependabot PRs a conventional title
# (chore(deps): ...), which the PR title check and release.yml need.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "06:00"
    timezone: Europe/Zurich
  open-pull-requests-limit: 3
  commit-message:
    prefix: chore
    include: scope
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    security-minor-and-patch:
      applies-to: security-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  cooldown:
    default-days: 7
- package-ecosystem: nuget
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "06:00"
    timezone: Europe/Zurich
  open-pull-requests-limit: 3
  commit-message:
    prefix: chore
    include: scope
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    security-minor-and-patch:
      applies-to: security-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  exclude-paths:
  - PKHeX.Core/**
  - PKHeX.AutoMod/**
  - docs/ui/compact-redesign/reference-prototype/**
  # Avalonia majors arrive as their own PRs (majors are never grouped). SkiaSharp moves with the
  # version Avalonia.Skia depends on, and the UI test projects stay on the xunit.v3 major that
  # Avalonia.Headless.XUnit is built against (see AGENTS.md, Dependency policy).
  ignore:
  - dependency-name: SkiaSharp*
    update-types:
    - version-update:semver-major
  - dependency-name: xunit.v3*
    update-types:
    - version-update:semver-major
  cooldown:
    default-days: 7
