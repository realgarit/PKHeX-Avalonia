name: Publish to Flathub

# Publishes a version-only update to flathub/io.github.realgarit.PKHeX-Avalonia after a
# GitHub release: one commit on an update branch, a pull request, flathubbot's test
# build, and the merge. Master is protected, so the merge is what starts Flathub's
# build and publishing flow; this job is the whole Flathub release.
#
# The automation changes only the release values of the manifest (archive URL and
# SHA-256, source commit, version, date) and nuget-sources.json. If the published
# Flathub manifest differs from packaging/flatpak/flathub/*.yaml.in in any other way,
# publish-flathub.py refuses: permission, runtime and build changes go through a
# reviewed manual update, because Flathub moderators review them.
#
# Needs the FLATHUB_TOKEN secret: a GitHub token with push access to the Flathub
# repository (classic token, `public_repo` scope). Without it the job is skipped.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Released tag to publish (vX.Y.Z)'
        type: string
        required: true
    secrets:
      FLATHUB_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Released tag to publish (vX.Y.Z)'
        type: string
        required: true
      dry_run:
        description: 'Dry run — stage the update and print the diff, but do not push.'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: flathub-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Update Flathub to ${{ inputs.tag }}
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.FLATHUB_TOKEN != '' }}
    steps:
      - name: Checkout this repository with tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout the Flathub packaging repository
        if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v7
        with:
          repository: flathub/io.github.realgarit.PKHeX-Avalonia
          token: ${{ secrets.FLATHUB_TOKEN }}
          path: flathub
          persist-credentials: true

      - name: Skip without a Flathub token
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::warning::FLATHUB_TOKEN is not configured; Flathub was not updated to ${TAG}."
          echo "Flathub not updated: FLATHUB_TOKEN is missing." >> "$GITHUB_STEP_SUMMARY"
        env:
          TAG: ${{ inputs.tag }}

      - name: Stage the version update
        if: env.HAS_TOKEN == 'true'
        id: stage
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -uo pipefail
          git fetch --force --tags origin
          python3 .github/scripts/publish-flathub.py "$TAG" flathub
          status=$?
          case "$status" in
            0) echo "outcome=staged" >> "$GITHUB_OUTPUT" ;;
            3) echo "outcome=current" >> "$GITHUB_OUTPUT" ;;
            2) echo "outcome=manual" >> "$GITHUB_OUTPUT"
               echo "Flathub not updated to ${TAG}: the published manifest needs a reviewed manual update." >> "$GITHUB_STEP_SUMMARY"
               exit 1 ;;
            *) exit "$status" ;;
          esac
          git -C flathub --no-pager diff --stat
          git -C flathub --no-pager diff -- io.github.realgarit.PKHeX-Avalonia.yaml

      # Flathub protects master: changes must come through a pull request and the
      # flathub/build and flathub/permissions status checks must pass. flathubbot
      # test-builds every PR (about 15 minutes for both architectures), so the job
      # opens the PR, waits for the checks, and merges. The permissions check only
      # holds for a permission change, which publish-flathub.py never stages.
      - name: Open the Flathub pull request, wait for its checks and merge it
        if: env.HAS_TOKEN == 'true' && steps.stage.outputs.outcome == 'staged' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
          GH_REPO: flathub/io.github.realgarit.PKHeX-Avalonia
        run: |
          set -euo pipefail
          cd flathub
          version="${TAG#v}"
          branch="update-${version}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$branch"
          git add io.github.realgarit.PKHeX-Avalonia.yaml nuget-sources.json
          git commit -q -m "Update to ${version}" \
                     -m "Automated from realgarit/PKHeX-Avalonia release ${TAG} by .github/workflows/flathub-publish.yml."
          # A re-run replaces the branch; the merge below is pinned to this commit.
          git push -q --force origin "HEAD:refs/heads/${branch}"
          head="$(git rev-parse HEAD)"

          # Only a pull request from this repository's own branch at exactly this
          # commit may be reused: a fork can open a PR under the same branch name.
          # gh's built-in jq has no --arg; the commit reaches the filter through $ENV.
          existing="$(HEAD_SHA="$head" gh pr list --head "$branch" --state open \
            --json number,headRefOid,headRepositoryOwner \
            --jq '[.[] | select(.headRefOid == $ENV.HEAD_SHA and .headRepositoryOwner.login == "flathub")][0].number // empty')"
          if [ -n "$existing" ]; then
            pr="$existing"
            echo "Reusing open pull request #${pr} for ${branch} at ${head}."
          else
            pr="$(gh pr create --base master --head "flathub:${branch}" --title "Update to ${version}" \
              --body "Automated version update from realgarit/PKHeX-Avalonia release ${TAG}: source archive, NuGet sources and version metadata only; no permission or manifest changes." \
              | grep -oE '[0-9]+$')"
            echo "Opened pull request #${pr}."
          fi
          echo "Flathub pull request: https://github.com/${GH_REPO}/pull/${pr}" >> "$GITHUB_STEP_SUMMARY"

          # Wait for flathubbot's test build. --watch returns non-zero on any failed
          # check, and the merge refuses any head other than the commit pushed above.
          sleep 60
          gh pr checks "$pr" --watch --fail-fast --interval 60
          gh pr merge "$pr" --merge --delete-branch --match-head-commit "$head"
          echo "Merged Flathub update to ${version}: Flathub builds and publishes it from master." >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run summary
        if: env.HAS_TOKEN == 'true' && steps.stage.outputs.outcome == 'staged' && github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: echo "DRY RUN — the update to ${{ inputs.tag }} was staged and printed above but not pushed." >> "$GITHUB_STEP_SUMMARY"
