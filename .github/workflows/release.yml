name: Release

# ---------------------------------------------------------------------------
# CI owns the version bump. PRs must NOT touch <UIVersion>.
#
# The old design had every PR hand-edit <UIVersion> and triggered this workflow
# on `paths: [Directory.Build.props]`. On 2026-08-28 four PRs (#267, #268, #269,
# #270) each branched off 1.48.3, each computed "patch + 1" = 1.48.4, and each
# wrote the byte-identical line. Git auto-merged all four with ZERO conflict, so:
#   * four distinct fixes shipped under one version number, and
#   * the three later merges produced no NET change to Directory.Build.props,
#     so the `paths:` filter never fired and no release run even started —
#     the published v1.48.4 was missing three fixes, including a crash fix.
# A conflict-resolution rule cannot fix that, because no conflict ever occurs.
#
# So: the next version is derived from the highest existing `v*` git tag, never
# from the file. A tag either exists on the remote or it does not, and
# `git push --atomic` makes claiming one a single server-side check.
#
# Bump, tag, build and publish all happen in ONE run. A GITHUB_TOKEN push does
# not trigger downstream workflows, so a second run must never be relied on.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
    # No `paths:` allow-list — that filter is what suppressed three releases.
    # Only paths that cannot affect a built artifact are ignored, and
    # `paths-ignore` skips a push only when EVERY changed file matches.
    # `.github/workflows/**` and `.github/scripts/**` are deliberately absent:
    # a packaging or signing change does change what ships.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - '.codex/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/upstream-sync/**'
      - '.gitattributes'
      - '.gitignore'
      - '.editorconfig'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — resolve and print the next version, then stop before writing, committing, tagging or releasing.'
        type: boolean
        default: true

permissions:
  contents: write       # push the bump commit + tag to main, publish the release
  pull-requests: read   # classify the merged PR behind the pushed commit

# Serialize: overlapping merges queue instead of racing for the same version.
#
# CAVEAT, deliberately accepted: GitHub cancels a *pending* run when a newer one
# queues behind an in-progress one, so a burst of merges can collapse into a
# single release run. That is safe here — the surviving run releases main's tip,
# which contains every merge, and resolve-release-version.sh takes the STRONGEST
# bump across every unreleased commit so a coalesced `feat:` still gets a minor.
# The cost is a skipped version number, never a missing fix.
concurrency:
  group: release-version
  cancel-in-progress: false

jobs:
  version:
    name: Resolve and claim version
    runs-on: ubuntu-latest
    # Never react to our own bump commit. GitHub already skips workflows for
    # `[skip ci]` and for GITHUB_TOKEN pushes; these checks are belt-and-braces
    # for the case where a human or a PAT replays the same commit.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.actor != 'github-actions[bot]' &&
        github.event.head_commit.author.name != 'github-actions[bot]' &&
        !contains(github.event.head_commit.message, '[skip ci]') &&
        !startsWith(github.event.head_commit.message, 'chore(release):')
      )
    outputs:
      version:     ${{ steps.resolve.outputs.next_version }}
      tag:         ${{ steps.resolve.outputs.next_tag }}
      release_sha: ${{ steps.claim.outputs.release_sha }}
      proceed:     ${{ steps.claim.outputs.proceed }}
    steps:
      # Always check out the ref that carries this workflow file, so the
      # workflow and .github/scripts/resolve-release-version.sh are the same
      # revision. A workflow_dispatch from a feature branch therefore runs that
      # branch's resolver — while still resolving, and releasing, main.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch main and tags
        run: git fetch --force --tags origin '+refs/heads/main:refs/remotes/origin/main'

      # A push event releases the commit that was pushed. A manual dispatch
      # always targets main's current tip, whatever branch it was launched from.
      - name: Determine target commit
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SHA="$(git rev-parse origin/main)"
          else
            SHA="$PUSH_SHA"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Target commit: $SHA"

      - name: Resolve next version from the tag set
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.target.outputs.sha }}
        run: bash .github/scripts/resolve-release-version.sh

      # Every resolved value reaches the shell through `env:`, never through a
      # `${{ }}` expression inside `run:` — a PR title is attacker-supplied text
      # and direct interpolation would be a script-injection hole.
      - name: Summary
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          PR_TITLE: ${{ steps.resolve.outputs.pr_title }}
          RULE: ${{ steps.resolve.outputs.rule }}
          BUMP: ${{ steps.resolve.outputs.bump }}
          CURRENT_TAG: ${{ steps.resolve.outputs.current_tag }}
          NEXT_VERSION: ${{ steps.resolve.outputs.next_version }}
          NEXT_TAG: ${{ steps.resolve.outputs.next_tag }}
          TAG_EXISTS: ${{ steps.resolve.outputs.tag_exists }}
          HEAD_ALREADY_TAGGED: ${{ steps.resolve.outputs.head_already_tagged }}
          SHOULD_RELEASE: ${{ steps.resolve.outputs.should_release }}
        run: |
          set -euo pipefail
          if [ -n "$PR_NUMBER" ]; then
            pr="#${PR_NUMBER} — ${PR_TITLE}"
          else
            pr="_none — classified from the commit subject_"
          fi
          {
            echo "### Release version resolution"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Mode | \`${EVENT_NAME}\` (dry_run=${DRY_RUN}) |"
            echo "| Target commit | \`${TARGET_SHA}\` |"
            echo "| Resolved PR | ${pr} |"
            echo "| Matched rule | \`${RULE}\` |"
            echo "| Bump | \`${BUMP}\` |"
            echo "| Current tag | \`${CURRENT_TAG}\` |"
            echo "| **Next version** | **\`${NEXT_VERSION}\`** |"
            echo "| Next tag | \`${NEXT_TAG}\` |"
            echo "| Tag already exists | \`${TAG_EXISTS}\` |"
            echo "| Head already released | \`${HEAD_ALREADY_TAGGED}\` |"
            echo "| Should release | \`${SHOULD_RELEASE}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # Claim the version: write the file, commit it back to main, and create
      # the tag — as ONE atomic ref update. The tag is the marker that says
      # "this version is spoken for", so it must land with the commit or not
      # at all.
      #
      # Trade-off, stated plainly: because the tag is claimed BEFORE the build,
      # a build failure leaves a tag with no release attached, and the next
      # merge moves on to the following version. That is a skipped number, not
      # a missing fix. Recover by deleting the orphan tag
      # (`git push origin :refs/tags/vX.Y.Z`) and re-running, or just let the
      # next merge publish. The alternative order (build first, tag after)
      # would tag a tree whose Directory.Build.props does not match the tag.
      # ---------------------------------------------------------------------
      - name: Claim version — bump, commit and tag
        id: claim
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          NEXT_VERSION: ${{ steps.resolve.outputs.next_version }}
          NEXT_TAG: ${{ steps.resolve.outputs.next_tag }}
          SHOULD_RELEASE: ${{ steps.resolve.outputs.should_release }}
          RULE: ${{ steps.resolve.outputs.rule }}
          BUMP: ${{ steps.resolve.outputs.bump }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
        run: |
          set -euo pipefail

          if [ "${DRY_RUN}" = "true" ]; then
            echo "::notice::DRY RUN — resolved ${NEXT_TAG} (${BUMP}, rule ${RULE}). Stopping before any write, commit, tag or release."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "DRY RUN — nothing was written, committed, tagged or released." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "${SHOULD_RELEASE}" != "true" ]; then
            echo "::notice::Skipping release — see the resolution log above."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pushed=false
          for attempt in 1 2 3; do
            git fetch --force --tags origin main
            git reset --hard origin/main

            if git ls-remote --exit-code --tags origin "refs/tags/${NEXT_TAG}" >/dev/null 2>&1; then
              echo "::error::${NEXT_TAG} appeared on the remote while this run was resolving. Refusing to overwrite a published tag."
              exit 1
            fi

            sed -i -E "s#<UIVersion>[^<]*</UIVersion>#<UIVersion>${NEXT_VERSION}</UIVersion>#" Directory.Build.props
            grep -q "<UIVersion>${NEXT_VERSION}</UIVersion>" Directory.Build.props || {
              echo "::error::Failed to write <UIVersion>${NEXT_VERSION}</UIVersion> into Directory.Build.props."
              exit 1
            }

            if git diff --quiet -- Directory.Build.props; then
              echo "::warning::Directory.Build.props already reads ${NEXT_VERSION}; tagging main as-is without a bump commit."
            else
              git add Directory.Build.props
              git commit -m "chore(release): set UIVersion to ${NEXT_VERSION} [skip ci]" \
                         -m "Bumped by .github/workflows/release.yml (${BUMP}, rule: ${RULE}${PR_NUMBER:+, PR #${PR_NUMBER}})." \
                         -m "Version is derived from the latest git tag, not from this file. Do not hand-edit <UIVersion> in a PR."
            fi

            RELEASE_SHA="$(git rev-parse HEAD)"
            git tag -f -a "${NEXT_TAG}" -m "PKHeX-Avalonia ${NEXT_VERSION}" "${RELEASE_SHA}"

            if git push --atomic origin "HEAD:refs/heads/main" "refs/tags/${NEXT_TAG}"; then
              echo "Pushed ${NEXT_TAG} at ${RELEASE_SHA} together with the bump commit."
              echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
              pushed=true
              break
            fi

            echo "::warning::Atomic push rejected on attempt ${attempt} — nothing landed. Re-basing on the new main tip."
            git tag -d "${NEXT_TAG}" || true
            sleep $((attempt * 5))
          done

          if [ "${pushed}" != "true" ]; then
            echo "::error::Could not push the bump commit and ${NEXT_TAG} after 3 attempts. No partial state was created."
            exit 1
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.rid }}
    needs: version
    if: needs.version.outputs.proceed == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            artifact: PKHeX-Avalonia-win-x64
          - rid: linux-x64
            os: ubuntu-latest
            artifact: PKHeX-Avalonia-linux-x64
          - rid: osx-arm64
            os: macos-latest
            artifact: PKHeX-Avalonia-osx-arm64
          - rid: osx-x64
            os: macos-latest
            artifact: PKHeX-Avalonia-osx-x64

    runs-on: ${{ matrix.os }}

    steps:
      # Build the exact commit that was tagged, not whatever main has drifted
      # to since. The published artifact and the tag must be the same tree.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.release_sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      - name: Publish
        run: >
          dotnet publish PKHeX.Avalonia/PKHeX.Avalonia.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=true
          -p:UIVersion=${{ needs.version.outputs.version }}
          -o publish

      # macOS: ad-hoc sign and zip the .app bundle created by BundleApp MSBuild target
      - name: Package (macOS)
        if: startsWith(matrix.rid, 'osx')
        shell: bash
        run: |
          # dotnet publish already ran BundleApp, producing publish/PKHeX.Avalonia.app
          codesign --force --deep --sign - publish/PKHeX.Avalonia.app
          cd publish
          zip -r ../${{ matrix.artifact }}.zip PKHeX.Avalonia.app
          cd ..

      # Three-tier signing priority for macOS (see docs/packaging.md):
      #   1. Developer ID secrets present  → full sign + notarize (below, unchanged)
      #   2. else self-signed cert secrets → stable self-signed identity (tertius
      #      pattern) so repeat Gatekeeper prompts / TCC re-grants don't happen
      #      across updates, artifact suffixed "-selfsigned"
      #   3. else                          → ad-hoc/no identity, "-unsigned"
      - name: Determine macOS signing capability
        if: startsWith(matrix.rid, 'osx')
        id: mac_sign
        shell: bash
        run: |
          if [ -n "${{ secrets.MACOS_CERT_P12 }}" ] && [ -n "${{ secrets.MACOS_SIGN_IDENTITY }}" ] && [ -n "${{ secrets.APPLE_NOTARY_KEY }}" ]; then
            echo "Signing secrets present — will produce a Developer ID signed, notarized .dmg"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Developer ID signing secrets absent — will produce an UNSIGNED .dmg"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine macOS self-sign capability
        if: startsWith(matrix.rid, 'osx') && steps.mac_sign.outputs.enabled != 'true'
        id: mac_selfsign
        shell: bash
        run: |
          if [ -n "${{ secrets.SELFSIGN_CERT_P12_BASE64 }}" ] && [ -n "${{ secrets.SELFSIGN_CERT_PASSWORD }}" ] && [ -n "${{ secrets.SELFSIGN_IDENTITY }}" ]; then
            echo "Self-signed cert secrets present — will sign with a stable self-signed identity"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Self-signed cert secrets absent — will produce an UNSIGNED .dmg"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer ID certificate
        if: startsWith(matrix.rid, 'osx') && steps.mac_sign.outputs.enabled == 'true'
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Codesign with Developer ID (hardened runtime)
        if: startsWith(matrix.rid, 'osx') && steps.mac_sign.outputs.enabled == 'true'
        shell: bash
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          codesign --force --deep --options runtime --timestamp \
            --sign "$MACOS_SIGN_IDENTITY" publish/PKHeX.Avalonia.app
          codesign --verify --deep --strict --verbose=2 publish/PKHeX.Avalonia.app

      - name: Notarize and staple app bundle
        if: startsWith(matrix.rid, 'osx') && steps.mac_sign.outputs.enabled == 'true'
        shell: bash
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          echo "$APPLE_NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary_key.p8"
          ditto -c -k --keepParent publish/PKHeX.Avalonia.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/notary_key.p8" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple publish/PKHeX.Avalonia.app
          rm -f "$RUNNER_TEMP/notarize.zip" "$RUNNER_TEMP/notary_key.p8"

      # Tertius pattern: sign with a stable self-signed identity (not
      # notarized — no Apple Developer ID needed) so the codesign designated
      # requirement stays identical release over release. macOS then treats
      # updates as the same app: keychain items and TCC (Accessibility, Full
      # Disk Access, etc.) grants persist across `brew upgrade` / manual
      # re-download instead of re-prompting every time. See docs/packaging.md.
      - name: Import self-signed certificate
        if: startsWith(matrix.rid, 'osx') && steps.mac_sign.outputs.enabled != 'true' && steps.mac_selfsign.outputs.enabled == 'true'
        shell: bash
        env:
          P12_BASE64: ${{ secrets.SELFSIGN_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SELFSIGN_CERT_PASSWORD }}
        run: |
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/selfsign.p12"
          export KEYCHAIN="$RUNNER_TEMP/pkhex-avalonia-ci.keychain-db"
          chmod +x Scripts/import-cert.sh
          Scripts/import-cert.sh "$RUNNER_TEMP/selfsign.p12"
          rm -f "$RUNNER_TEMP/selfsign.p12"
          echo "SELFSIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Codesign with self-signed identity
        if: startsWith(matrix.rid, 'osx') && steps.mac_sign.outputs.enabled != 'true' && steps.mac_selfsign.outputs.enabled == 'true'
        shell: bash
        env:
          SELFSIGN_IDENTITY: ${{ secrets.SELFSIGN_IDENTITY }}
        run: |
          security unlock-keychain -p "pkhex-avalonia-build" "$SELFSIGN_KEYCHAIN" 2>/dev/null || true
          # --deep re-signs every nested Mach-O (frameworks, native libs, the
          # main executable) with the same identity, not just the top level.
          codesign --force --deep --sign "$SELFSIGN_IDENTITY" --keychain "$SELFSIGN_KEYCHAIN" publish/PKHeX.Avalonia.app
          codesign --verify --deep --strict --verbose=2 publish/PKHeX.Avalonia.app

      - name: Build DMG
        if: startsWith(matrix.rid, 'osx')
        shell: bash
        run: |
          DMG_STAGING=$(mktemp -d)
          cp -R publish/PKHeX.Avalonia.app "$DMG_STAGING/"
          ln -s /Applications "$DMG_STAGING/Applications"
          if [ "${{ steps.mac_sign.outputs.enabled }}" = "true" ]; then
            DMG_NAME="${{ matrix.artifact }}.dmg"
          elif [ "${{ steps.mac_selfsign.outputs.enabled }}" = "true" ]; then
            DMG_NAME="${{ matrix.artifact }}-selfsigned.dmg"
          else
            DMG_NAME="${{ matrix.artifact }}-unsigned.dmg"
          fi
          hdiutil create -volname "PKHeX-Avalonia" -srcfolder "$DMG_STAGING" -ov -format UDZO "$DMG_NAME"
          rm -rf "$DMG_STAGING"

      # Linux: make executable and zip
      - name: Package (Linux)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          chmod +x publish/PKHeX.Avalonia
          cd publish
          zip -r ../${{ matrix.artifact }}.zip .
          cd ..

      - name: Build AppImage
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          mkdir -p AppDir/usr/bin

          cp publish/* AppDir/usr/bin/

          cp PKHeX.Avalonia/Assets/Icons/icon.png AppDir/pkhex.png

          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/PKHeX.Avalonia" "$@"
          EOF

          chmod +x AppDir/AppRun

          cat > AppDir/pkhex.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=PKHeX
          Exec=PKHeX.Avalonia
          Icon=pkhex
          Categories=Utility;
          Terminal=false
          EOF

          wget -q \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage

          chmod +x appimagetool-x86_64.AppImage

          ARCH=x86_64 \
            ./appimagetool-x86_64.AppImage \
            --appimage-extract-and-run \
            AppDir \
            PKHeX-Avalonia-linux-x64.AppImage

          # remove the AppImage tool from the artifact list since we don't need it anymore
          rm appimagetool-x86_64.AppImage

      # Windows: zip the publish folder
      - name: Package (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath ${{ matrix.artifact }}.zip

      - name: Install Inno Setup
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      # Gate real code signing on repo secrets. Without them we still ship an
      # installer (clearly named "-unsigned") so the artifact shape stays
      # stable either way; see docs/packaging.md for the secrets a repo
      # owner needs to add to turn this on.
      - name: Determine Windows signing capability
        if: matrix.rid == 'win-x64'
        id: win_sign
        shell: pwsh
        run: |
          if ("${{ secrets.WINDOWS_CERT_P12 }}" -ne "" -and "${{ secrets.WINDOWS_CERT_PASSWORD }}" -ne "") {
            Write-Host "Signing secrets present -- will produce a code-signed installer"
            "enabled=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Signing secrets absent -- will produce an UNSIGNED installer"
            "enabled=false" >> $env:GITHUB_OUTPUT
          }

      - name: Import Windows code-signing certificate
        if: matrix.rid == 'win-x64' && steps.win_sign.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_P12: ${{ secrets.WINDOWS_CERT_P12 }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "windows-cert.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_P12))
          "CERT_PATH=$certPath" >> $env:GITHUB_ENV

      - name: Code-sign application executable
        if: matrix.rid == 'win-x64' && steps.win_sign.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /f "$env:CERT_PATH" /p "$env:WINDOWS_CERT_PASSWORD" /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 publish\PKHeX.Avalonia.exe

      - name: Build Inno Setup installer
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ needs.version.outputs.version }}" `
            "/DSourceDir=$(Resolve-Path publish)" `
            "/DOutputDir=$(Get-Location)" `
            "packaging/windows/installer.iss"

      - name: Code-sign installer
        if: matrix.rid == 'win-x64' && steps.win_sign.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /f "$env:CERT_PATH" /p "$env:WINDOWS_CERT_PASSWORD" /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 PKHeX-Avalonia-Setup.exe

      - name: Rename unsigned installer
        if: matrix.rid == 'win-x64' && steps.win_sign.outputs.enabled != 'true'
        shell: pwsh
        run: Rename-Item PKHeX-Avalonia-Setup.exe PKHeX-Avalonia-Setup-unsigned.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            *.AppImage
            *.dmg
            PKHeX-Avalonia-Setup*.exe
          if-no-files-found: ignore
          retention-days: 5

  release:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest

    steps:
      # The tag already exists — the version job created it atomically with the
      # bump commit, before anything was built. Nothing here creates refs.
      - name: Checkout the tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.release_sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ needs.version.outputs.release_sha }}
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.dmg
            artifacts/**/PKHeX-Avalonia-Setup*.exe
          draft: false
          prerelease: false
