name: Flatpak

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '*.md'
  workflow_dispatch:
  workflow_call:
    inputs:
      source_revision:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.source_revision || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-flatpak:
    name: Build and run Flatpak (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_revision || github.sha }}
      - name: Install builder and validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream desktop-file-utils xvfb xdotool imagemagick xdg-desktop-portal xdg-desktop-portal-gtk
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.freedesktop.Sdk.Extension.dotnet10//25.08
      - name: Prepare source-pinned build
        run: python3 .github/scripts/prepare-flatpak.py tmp/flatpak
      - name: Build offline and export
        run: |
          flatpak-builder --user --force-clean --repo=tmp/flatpak/repo tmp/flatpak/build tmp/flatpak/io.github.realgarit.PKHeX-Avalonia.json
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo tmp/flatpak/repo tmp/flatpak/PKHeX-Avalonia-linux-x86_64.flatpak io.github.realgarit.PKHeX-Avalonia
      - name: Install the exported bundle
        run: flatpak install --user -y --noninteractive tmp/flatpak/PKHeX-Avalonia-linux-x86_64.flatpak
      - name: Verify sandbox and launch the installed application
        run: xvfb-run -a dbus-run-session -- bash .github/scripts/smoke-flatpak.sh tmp/flatpak
      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: PKHeX-Avalonia-flatpak
          path: tmp/flatpak/*.flatpak
          retention-days: 14
      - name: Upload build and runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-evidence
          path: |
            tmp/flatpak/*.log
            tmp/flatpak/*.png
            tmp/flatpak/io.github.realgarit.PKHeX-Avalonia.json
          retention-days: 14
